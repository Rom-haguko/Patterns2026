openapi: "3.0.3"
info:
  title: Patterns2026 API
  version: "1.0.0"

paths:
  /api/get_report:
    get:
      operationId: main.get_report
      summary: Получить отчёт (базовый маршрут)
      responses:
        "200":
          description: Текстовый отчёт

  /api/report-formats:
    get:
      operationId: src.logics.api_server.api_get_report_formats
      summary: Список доступных форматов отчётов
      responses:
        "200":
          description: Список названий форматов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/report:
    get:
      operationId: main.get_report_by_query
      summary: Получить отчёт по query-параметрам
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Отчёт
        "400":
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/report/default/{entity_type}/{entity_code}:
    get:
      operationId: main.get_report_default
      summary: Получить отчёт в формате по умолчанию
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: entity_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Отчёт
        "400":
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

